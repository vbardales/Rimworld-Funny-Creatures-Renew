<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Funny Creatures Renew preview</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:896px; height:504px; overflow:hidden; }
.stage { position:relative; width:896px; height:504px; font-family:"Segoe UI",system-ui,sans-serif; }
.shot { position:absolute; inset:0; width:896px; height:504px; object-fit:cover; object-position:50% 60%; }
.veil { position:absolute; inset:0; background:radial-gradient(circle at 0 0, var(--veilStrong) 0%, var(--veilClear) 82%); }
.text { position:absolute; left:50px; top:54px; width:360px; color:var(--inkPrimary); }
h1 { font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; }
.suffix { font-size:.65em; color:var(--inkSecondary); }
.tag { margin-top:8px; font-size:24px; font-weight:400; line-height:1.1; letter-spacing:.2px; color:var(--inkSecondary); }
h1,.tag,p { text-shadow:0 3px 10px rgba(0,0,0,.75); }
.rule { width:58px; height:3px; background:var(--accent); margin:20px 0 16px; }
p { font-size:21px; font-weight:400; line-height:1.45; }
.badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); color:var(--badgeInk); font-size:26px; font-weight:700; line-height:1; }
</style>
<div class="stage">
  <img class="shot" src="Preview-source.png" alt="">
  <div class="veil"></div>
  <div class="text">
    <h1>Funny Creatures<br><span class="suffix">Renew</span></h1>
    <div class="tag">(unofficial)</div>
    <div class="rule"></div>
    <p>Two animals, brought forward to 1.6. One of them explodes.</p>
  </div>
  <div class="badge"></div><div class="version">1.6</div>
</div>
<script>
// Serve Art/ over HTTP; the renderer waits for this promise before capturing.
window.previewReady = (async () => {
  const palette = await (await fetch('preview-palette.json')).json();
  for (const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
  const rgb = palette.veil.match(/[a-f\d]{2}/gi).map(v=>parseInt(v,16)).join(',');
  document.documentElement.style.setProperty('--veilStrong',`rgba(${rgb},.96)`);
  document.documentElement.style.setProperty('--veilClear',`rgba(${rgb},0)`);
  await document.fonts.ready;
  await document.querySelector('.shot').decode();
  return true;
})();
</script></html>
